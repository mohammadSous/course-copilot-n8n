services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Amman   # used by the Schedule Trigger
      - TZ=Asia/Amman                 # system clock inside the container
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n      # workflows, encrypted credentials, history

volumes:
  n8n_data:
